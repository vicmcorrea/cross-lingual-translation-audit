[project]
name = "cross-lingual-translation-audit"
version = "0.2.0"
description = "Reference-free audit of paired Portuguese and English translations"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "hydra-core>=1.3.2,<2",
  "lingua-language-detector==2.2.0",
  "numpy>=2.3,<3",
  "omegaconf>=2.3,<3",
  "polars>=1.33,<2",
  "pyarrow>=21,<23",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "scikit-learn>=1.7,<2",
  "scipy>=1.16,<2",
  "statsmodels>=0.14.5,<1",
  "structlog>=25.4,<26",
]

[project.optional-dependencies]
gpu = [
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
  "sentence-transformers>=5.1,<6",
  "torch==2.11.0",
  "transformers>=4.56,<5",
]

[project.scripts]
translation-audit = "translation_audit.cli:main"
build-curated-cohort = "translation_audit.data.cohort:main"

[dependency-groups]
dev = [
  "coverage[toml]>=7.10,<8",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["uv_build>=0.8.14,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "translation_audit"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["translation_audit"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["translation_audit"]
omit = ["src/translation_audit/emotion/backend.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
