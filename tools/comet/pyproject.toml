[project]
name = "translation-audit-comet-runtime"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "huggingface-hub>=0.34,<1",
  "torch==2.11.0",
  "unbabel-comet>=2.2.7,<3",
]

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
